<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chi tiêu">
<title>Chi tiêu</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171f;--mu:#7a808c;--ac:#10b981;--ac2:#059669;--bd:#e6e8ec;--rd:#ef4444;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--card:#1a1d23;--tx:#f1f3f6;--mu:#8b92a0;--bd:#2a2e36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1013;--card:#1a1d23;--tx:#f1f3f6;--mu:#8b92a0;--bd:#2a2e36;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
[hidden]{display:none!important}
main{max-width:520px;margin:0 auto;padding:12px 16px 160px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
header button{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:20px}
#mlabel{font-weight:700;font-size:17px}
.sum{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:20px;padding:18px;margin-bottom:12px}
.sum small{opacity:.85}.sum h2{margin:2px 0 10px;font-size:32px;letter-spacing:-.5px}
.sum2{display:flex;gap:10px}.sum2 div{flex:1;background:rgba(255,255,255,.18);border-radius:12px;padding:8px 10px}
.sum2 small{display:block;font-size:12px}.sum2 b{font-size:16px}
.sum .go{margin-top:12px;background:#fff;color:var(--ac2);font-weight:700;padding:9px 14px;border-radius:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.card>b{display:block;margin-bottom:8px}.card ul{margin:0;padding-left:18px}.card li{margin-bottom:6px}
.mu{color:var(--mu);font-size:13px}
.day{margin:18px 4px 6px;color:var(--mu);font-size:13px;display:flex;justify-content:space-between}
.it,.bl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:7px}
.ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.m{flex:1;min-width:0}.m b{display:block;font-weight:600}.m small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p{font-weight:700}.p.in{color:var(--ac2)}
.bl.od{border-color:var(--rd)}.bl.od small{color:var(--rd)}
.bl .chk{font-size:22px}.bl .x,.x{color:var(--mu);font-size:13px;padding:6px}
.nt{margin:-3px 0 8px!important;font-size:14px!important;border-color:var(--rd)!important}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid var(--bd);font-size:14px}
.ck.now{background:var(--bg);border-radius:10px;font-weight:600}.ck .dd{width:48px}.ck .gt{flex:1}.ck .gt small{display:block;color:var(--mu);font-weight:400;font-size:12px}.ck b{color:var(--ac2)}
.dn{display:block;width:210px;margin:6px auto 12px;color:var(--tx)}
.lg{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}.lg i{width:12px;height:12px;border-radius:4px;flex:none}
.lg span:first-of-type{flex:1}.lg .mu{width:52px;text-align:right}.lg b{width:52px;text-align:right}
.split{display:flex;height:12px;border-radius:7px;overflow:hidden;margin:6px 0}.lg2{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.alh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}.al{margin-bottom:12px}
.pc{width:56px;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;text-align:right}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:15}
#tabs button{flex:1;padding:8px 0 6px;font-size:12px;color:var(--mu)}#tabs button span{display:block;font-size:22px}#tabs button.on{color:var(--ac2);font-weight:700}
#fab{position:fixed;right:20px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;font-size:34px;box-shadow:0 6px 18px rgba(16,185,129,.45);z-index:14}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto}
.sheet h3{margin:0 0 12px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;padding:9px;border-radius:10px;font-weight:600;color:var(--mu)}.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.amt{width:100%;font-size:32px;font-weight:700;border:0;border-bottom:2px solid var(--bd);background:none;color:var(--tx);padding:6px 0;outline:none;margin-bottom:6px}.amt:focus{border-color:var(--ac)}
.qs{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.chip{padding:7px 12px;border-radius:20px;background:var(--bg);border:1px solid var(--bd);font-size:14px}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 12px}
.cg button{padding:8px 2px;border-radius:12px;background:var(--bg);border:2px solid transparent;font-size:12px}.cg button span{display:block;font-size:22px}.cg button small{display:block;color:var(--mu);font-size:10px}.cg button.on{border-color:var(--ac)}
.f{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin-bottom:10px}
.ph{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:12px;border:2px dashed var(--bd);color:var(--mu);margin-bottom:10px;cursor:pointer}.ph input{display:none}
.pv{width:100%;border-radius:12px;margin-bottom:10px;max-height:260px;object-fit:contain;background:var(--bg)}
.pri{width:100%;padding:14px;border-radius:14px;background:var(--ac);color:#fff;font-weight:700;font-size:17px}
.sec{width:100%;padding:13px;border-radius:14px;background:var(--bg);border:1px solid var(--bd);margin-top:8px}.dng{color:var(--rd)}
.tst{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:60}
textarea.f{height:110px;font-size:12px}
</style>
</head>
<body>
<main>
<header><button id="prev" aria-label="Tháng trước">‹</button><div id="mlabel"></div><button id="next" aria-label="Tháng sau">›</button><button id="gear" aria-label="Cài đặt">⚙</button></header>
<div id="view"></div>
</main>
<nav id="tabs"><button data-t="home"><span>🧾</span>Giao dịch</button><button data-t="chart"><span>📊</span>Biểu đồ</button><button data-t="plan"><span>🎯</span>Kế hoạch</button><button data-t="long"><span>🏦</span>Dài hạn</button></nav>
<button id="fab" aria-label="Thêm">+</button>
<div id="sh" class="shade" hidden><div class="sheet" id="shc"></div></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)},$$=function(s,f){Array.prototype.forEach.call(document.querySelectorAll(s),f)};
var CATS=[["Ăn uống","🍜","cd"],["Ăn ngoài","🍻","ps"],["Internet","🌐","cd"],["Đi lại","🛵","cd"],["Nhà cửa","🏠","cd"],["Học tập","📚","cd"],["Mua sắm","🛍️","ps"],["Giải trí","🎮","ps"],["Sức khoẻ","💊","ps"],["Khác","📦","ps"]];
var INC=[["Trợ cấp","🎁",1],["Lương","💼",1],["Làm thêm","🧑‍💻",0],["Khác","💰",0]];
var COL=["#10b981","#3b82f6","#f59e0b","#ef4444","#8b5cf6","#ec4899","#14b8a6","#f97316","#6366f1","#84cc16"];
var ex=[],bills={},set={goals:[],al:[50,30,20]},cur=new Date(),tab="home",mem={};
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r===null?mem[k]:r}localStorage.setItem(k,v)}catch(e){if(v!==undefined)mem[k]=v;else return mem[k]}}
function load(){try{ex=JSON.parse(ls("cx_ex")||"[]")}catch(e){ex=[]}try{bills=JSON.parse(ls("cx_bills")||"{}")}catch(e){bills={}}try{var s=JSON.parse(ls("cx_set")||"{}");if(s.goals)set.goals=s.goals;if(s.al&&s.al.length===3)set.al=s.al}catch(e){}}
function save(){ls("cx_ex",JSON.stringify(ex));ls("cx_bills",JSON.stringify(bills));ls("cx_set",JSON.stringify(set))}
var dbp=new Promise(function(r){try{var q=indexedDB.open("cx",1);q.onupgradeneeded=function(){q.result.createObjectStore("p")};q.onsuccess=function(){r(q.result)};q.onerror=function(){r(null)}}catch(e){r(null)}});
function idb(m,k,v){return dbp.then(function(d){if(!d)return null;return new Promise(function(r){try{var t=d.transaction("p","readwrite").objectStore("p");var q=m==="put"?t.put(v,k):m==="get"?t.get(k):m==="clear"?t.clear():t.delete(k);q.onsuccess=function(){r(q.result)};q.onerror=function(){r(null)}}catch(e){r(null)}})})}
function money(n){return Math.round(n).toLocaleString("vi-VN")+"đ"}
function short(n){return n>=1e6?(n/1e6).toFixed(1).replace(".0","")+"tr":n>=1e3?Math.round(n/1e3)+"k":Math.round(n)+""}
function z(n){return String(n).padStart(2,"0")}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function toast(t){var e=document.createElement("div");e.className="tst";e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},1800)}
function today(){var d=new Date();return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function mkey(){return cur.getFullYear()+"-"+z(cur.getMonth()+1)}
function dim(){return new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate()}
function bdue(b,k){return b.due||(k+"-"+z(Math.min(b.day,new Date(+k.slice(0,4),+k.slice(5,7),0).getDate())))}
function dfmt(d){var p=d.split("-");return p[2]+"/"+p[1]}
function shiftm(d){var p=d.split("-"),dt=new Date(+p[0],+p[1],1),l=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();return dt.getFullYear()+"-"+z(dt.getMonth()+1)+"-"+z(Math.min(+p[2],l))}
function shrink(f){return new Promise(function(res){var u=URL.createObjectURL(f),i=new Image();i.onload=function(){var k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.65))};i.onerror=function(){res(null)};i.src=u})}
function fmt(el){var v=parseInt(el.value.replace(/\D/g,"")||"0",10);el.value=v?v.toLocaleString("vi-VN"):""}
function num(el){return parseInt(el.value.replace(/\D/g,"")||"0",10)}
function look(e){var l=e.k?INC:CATS;return l.filter(function(x){return x[0]===e.c})[0]||[e.c,"📦",e.k?0:"ps"]}
function grp(e){return e.g||look(e)[2]}
function tag(e){return e.k?(look(e)[2]===1?"Thu cố định":"Kiếm thêm"):(grp(e)==="cd"?"Cố định":"Phát sinh")}
function sheet(h){$("#shc").innerHTML=h;$("#sh").hidden=false}
function closeSheet(){$("#sh").hidden=true;$("#shc").innerHTML=""}
$("#shc").onclick=function(ev){var t=ev.target.closest("[data-zf]");if(!t)return;var el=$("#"+t.getAttribute("data-zf")),v=num(el)*1000;el.value=v?v.toLocaleString("vi-VN"):"";el.focus()};
$("#sh").onclick=function(e){if(e.target===$("#sh"))closeSheet()};

/* ---------- dữ liệu tháng ---------- */
function mdata(){var k=mkey(),L=ex.filter(function(e){return e.d.indexOf(k)===0}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.t-a.t});
var o={L:L,out:0,inn:0,fix:0,by:{},ib:{},g:{cd:0,ps:0}};
L.forEach(function(e){if(e.k){o.inn+=e.a;o.ib[e.c]=(o.ib[e.c]||0)+e.a;if(look(e)[2]===1)o.fix+=e.a}else{o.out+=e.a;o.by[e.c]=(o.by[e.c]||0)+e.a;o.g[grp(e)]+=e.a}});return o}

/* ---------- Giao dịch ---------- */
function vHome(m){
var rm=m.inn-m.out;
var h='<section class="sum"><small>Tổng chi tháng này</small><h2>'+money(m.out)+'</h2><div class="sum2"><div><small>Thu nhập</small><b>+'+money(m.inn)+'</b></div><div><small>Còn lại</small><b>'+(rm<0?"-":"")+money(Math.abs(rm))+'</b></div></div></section>',day="";
m.L.forEach(function(e){
if(e.d!==day){day=e.d;var dt=m.L.filter(function(x){return x.d===day&&!x.k}).reduce(function(s,x){return s+x.a},0),p=day.split("-");h+='<div class="day"><span>'+(day===today()?"Hôm nay":p[2]+"/"+p[1])+"</span><span>"+(dt?money(dt):"")+"</span></div>"}
h+='<button class="it" data-a="it" data-id="'+e.id+'"><div class="ic">'+look(e)[1]+'</div><div class="m"><b>'+(esc(e.n)||e.c)+"</b><small>"+e.c+" · "+tag(e)+(e.p?" · 📷":"")+'</small></div><div class="p'+(e.k?" in":"")+'">'+(e.k?"+":"")+money(e.a)+"</div></button>"});
return h+(m.L.length?"":'<div class="empty">Chưa có giao dịch nào.<br>Bấm + để thêm.</div>')}

/* ---------- Biểu đồ ---------- */
function donut(by,tot,sym){
var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]}),off=25,svg='<svg viewBox="0 0 42 42" class="dn"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--bd)" stroke-width="6"/>';
ks.forEach(function(c,i){var p=by[c]/tot*100;svg+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+COL[i%10]+'" stroke-width="6" stroke-dasharray="'+p+" "+(100-p)+'" stroke-dashoffset="'+off+'"/>';off-=p});
svg+='<text x="21" y="22.2" text-anchor="middle" font-size="4" font-weight="700" fill="currentColor">'+short(tot)+"</text></svg>";
return svg+ks.map(function(c,i){return '<div class="lg"><i style="background:'+COL[i%10]+'"></i><span>'+look({c:c,k:sym})[1]+" "+c+"</span><b>"+(by[c]/tot*100).toFixed(1)+'%</b><span class="mu">'+short(by[c])+"</span></div>"}).join("")}
function vChart(m){
if(!m.out&&!m.inn)return '<div class="empty">Chưa có dữ liệu trong tháng này.</div>';
var h='<div class="card"><b>Tổng quan tháng</b><div class="lg2"><span>⬆️ Thu '+money(m.inn)+"</span><span>⬇️ Chi "+money(m.out)+"</span></div></div>";
if(m.inn)h+='<div class="card"><b>Thu nhập theo nguồn</b>'+donut(m.ib,m.inn,1)+"</div>";
if(m.out){var pc=m.g.cd/m.out*100;
h+='<div class="card"><b>Chi tiêu theo danh mục</b>'+donut(m.by,m.out,0)+'</div><div class="card"><b>Cố định và phát sinh</b><div class="split"><div style="width:'+pc+'%;background:#3b82f6"></div><div style="width:'+(100-pc)+'%;background:#f59e0b"></div></div><div class="lg2"><span>🔵 Cố định '+pc.toFixed(0)+"% · "+short(m.g.cd)+"</span><span>🟠 Phát sinh "+(100-pc).toFixed(0)+"% · "+short(m.g.ps)+"</span></div></div>"}
return h}

/* ---------- Kế hoạch: tính toán ---------- */
function calc(m){
var k=mkey(),N=dim(),td=today(),isCur=td.indexOf(k)===0,dn=isCur?+td.slice(8):(td<k+"-01"?0:N),F=Math.max(0,m.fix-m.out),xs=Math.max(0,m.out-m.fix),i;
var B=(bills[k]||[]).slice().sort(function(a,b){var x=bdue(a,k),y=bdue(b,k);return x<y?-1:x>y?1:0});
var nb=B.map(function(b){var due=bdue(b,k),dd=due.indexOf(k)===0?+due.slice(8):(due<k+"-01"?1:N),c=Math.min(F,b.a);F-=c;return{b:b,due:due,dd:dd,net:b.a-c}});
var e=[],r=[];for(i=0;i<=N+1;i++){e[i]=0;r[i]=0}
m.L.forEach(function(x){if(x.k&&look(x)[2]!==1)e[+x.d.slice(8)]+=x.a});
nb.forEach(function(o){for(var j=1;j<=o.dd;j++)r[j]+=o.net/o.dd});
function rem(upTo){var E=0,j;for(j=1;j<=upTo;j++)E+=e[j];E=Math.max(0,E-xs);return nb.map(function(o){var c=Math.min(E,o.net);E-=c;return o.b.paid?0:o.net-c})}
var days=[],sur=[];
for(i=1;i<=dn;i++){var d=e[i]-r[i];days[i]={t:r[i],e:e[i],got:0,from:[],gave:0};if(d>0.5)sur.push({i:i,a:d})}
for(i=1;i<=dn;i++){var D=days[i],need=D.t-D.e;if(need<=0.5)continue;
while(need>0.5&&sur.length){var s=sur[0],u=Math.min(s.a,need);s.a-=u;need-=u;D.got+=u;D.from.push({i:s.i,a:u});days[s.i].gave+=u;if(s.a<=0.5)sur.shift()}}
var all=rem(dn),prev=dn>=1?rem(dn-1):all,T=0;
nb.forEach(function(o,ix){if(dn>=1&&o.dd>=dn)T+=prev[ix]/(o.dd-dn+1)});
function fut(j){var s=0;nb.forEach(function(o,ix){if(o.dd>dn&&j<=o.dd)s+=all[ix]/(o.dd-dn)});return s}
return{k:k,N:N,td:td,isCur:isCur,dn:dn,nb:nb,e:e,days:days,rem:all,T:Math.ceil(T/1000)*1000,fut:fut,xs:xs}}

/* ---------- Kế hoạch: hiển thị ---------- */
function vPlan(m){
var C=calc(m),k=C.k,N=C.N,td=C.td,isCur=C.isCur,dn=C.dn,B=C.nb,i;
var bt=B.reduce(function(s,o){return s+o.b.a},0),toEarn=B.reduce(function(s,o){return s+o.net},0),tot=C.e.reduce(function(s,v){return s+v},0),left=C.rem.reduce(function(s,v){return s+v},0);
var odTot=0;B.forEach(function(o,ix){if(o.dd<dn)odTot+=C.rem[ix]});
var tE=isCur?C.e[dn]:0,h="";
if(!toEarn)h+='<section class="sum"><small>Kế hoạch tháng này</small><h2>Đã đủ 🎉</h2><div>Thu nhập cố định đã đủ cho khoản phải trả.</div></section>';
else if(left<=0.5)h+='<section class="sum"><small>Kế hoạch tháng này</small><h2>Đã kiếm đủ 🎉</h2><div>Đã đủ tiền cho mọi khoản phải trả.</div></section>';
else if(isCur)h+='<section class="sum"><small>Hôm nay cần kiếm</small><h2>'+money(C.T)+"</h2><div>Đã kiếm "+money(tE)+" · còn thiếu "+money(Math.max(0,C.T-tE))+"</div>"+(odTot>0.5?'<div style="margin-top:6px">Khoản quá hạn còn thiếu: '+money(odTot)+"</div>":"")+'<button class="go" data-a="ai">+ Ghi thu nhập hôm nay</button></section>';
else h+='<section class="sum"><small>Cần kiếm thêm cả tháng</small><h2>'+money(toEarn)+"</h2><div>Còn thiếu "+money(left)+"</div></section>";
var x3=new Date();x3.setDate(x3.getDate()+3);var lim=x3.getFullYear()+"-"+z(x3.getMonth()+1)+"-"+z(x3.getDate()),tips=[],avail=m.inn-bt-m.out,rem=isCur?N-dn+1:0;
var soon=B.filter(function(o){return !o.b.paid&&o.due>=td&&o.due<=lim});
